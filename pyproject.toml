[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pose-dynamics"
version = "0.0.1"
description = "Pose preprocessing and recurrence analysis utilities"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
fix = true

[tool.ruff.lint]
select = [
  "E",    
  "F",    
  "I",    
]
ignore = [
  "E501", 
]
