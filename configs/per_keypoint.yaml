# Simplest: no feature pipeline — analyse each keypoint's movement (speed) directly.
# Works on any canonical file.  Run:  pose-dynamics run configs/per_keypoint.yaml
data: ./data
frame_rate: 60
tau: 20
m: 4
# (no `features:` block -> per-keypoint speed)
default_signal: speed
compute_linear: true
compute_recurrence: true
target_rec: 5.0
window_s: 30
output_csv: ./metrics.csv
