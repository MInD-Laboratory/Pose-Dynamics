rqa:
  - analysis_type: "rqa"
    keypoints: ["pupil_mag"]
    embedding: { dim: 4, tau: 20 }
    norm: "minmax"          
    rescale_norm: true      
    radius_mode: "absolute"
    radius: 0.2             
    line_min: 4             
    theiler: 2
    output_name: "rqa_pupil_mag"

  - analysis_type: "rqa"
    keypoints: ["blink"]
    embedding: { dim: 4, tau: 20 }
