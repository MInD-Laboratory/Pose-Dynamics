    norm: "minmax"          # align to legacy normalization
    rescale_norm: true      # align to legacy rescaling
    radius_mode: "absolute"
    radius: 0.3             # legacy CRQA radius
    line_min: 2
    theiler: 0
    output_name: "crqa_pupil_face"

  - analysis_type: "crqa"
